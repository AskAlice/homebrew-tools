name: CI
# Only formula changes need this; cask bumps (Casks/**) from the SpacialShell release
# workflow would otherwise trigger it on every release.
on:
  push:
    paths: ['Formula/**', '.github/workflows/main.yml']
jobs:
  test:
    strategy:
      matrix:
        runs-on: ['macOS-latest']

    runs-on: ${{ matrix.runs-on }}

    steps:
    - uses: actions/checkout@v1

    - name: Install tools
      run: |
        brew install --build-bottle --verbose Formula/ghsync.rb

    # FIXME: Some tools have no tests
    # - name: Run tests
    #   run: |
    #     brew test Formula/*.rb
